# Fly.io deployment. Secrets (SESSION_SECRET, Stripe, SMTP, LICENSE_SIGNING_KEY) are set with
# `fly secrets set`, never here. SQLite lives on the `labels_data` volume, so run exactly one machine.
app = "product-labels-luay"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = "15s"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DATA_DIR = "/data"
  TRUST_PROXY = "1"
  PUBLIC_APP_URL = "https://product-labels-luay.fly.dev"

[mounts]
  source = "labels_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Keep the single machine running: the email outbox is delivered by an in-process timer.
  auto_stop_machines = "off"
  auto_start_machines = true

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    port = 3000
    timeout = "3s"

[deploy]
  strategy = "rolling"
  max_unavailable = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
